name: Pack

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  BUILD_CONFIGURATION: 'Release'
  PROJECT_PATH: 'src/YongAnGame.ModuleLib/YongAnGame.ModuleLib.csproj'
  ARTIFACTS_DIR: 'artifacts'

jobs:
  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Trusted Publishing 必需：允许申请 OIDC token
      contents: read

    steps:
      # ──────────────────────────────────────────────
      # MinVer 依赖完整 git 历史才能正确推导版本
      # 浅克隆会让版本回退到 0.0.0
      # ──────────────────────────────────────────────
      - name: 检出代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: 缓存 NuGet 包
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 恢复依赖
        run: dotnet restore

      # ──────────────────────────────────────────────
      # MinVer 自动从 git tag 推导版本，无需传参
      # ──────────────────────────────────────────────
      - name: 构建
        run: >
          dotnet build "${{ env.PROJECT_PATH }}"
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: 打包
        run: >
          dotnet pack "${{ env.PROJECT_PATH }}"
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-build
          --output "${{ env.ARTIFACTS_DIR }}"

      # ──────────────────────────────────────────────
      # 从 nupkg 文件名反推版本，供后续步骤引用
      # ──────────────────────────────────────────────
      - name: 读取生成的版本
        id: version
        shell: bash
        run: |
          PKG=$(ls "${{ env.ARTIFACTS_DIR }}"/*.nupkg | head -n1)
          FILENAME=$(basename "$PKG" .nupkg)
          VERSION="${FILENAME#YongAnGame.ModuleLib.}"
          echo "包版本：$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 列出产物
        run: ls -lh "${{ env.ARTIFACTS_DIR }}"

      - name: 上传 NuGet 产物
        uses: actions/upload-artifact@v5
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: |
            ${{ env.ARTIFACTS_DIR }}/*.nupkg
            ${{ env.ARTIFACTS_DIR }}/*.snupkg
          retention-days: 30

      # ──────────────────────────────────────────────
      # Trusted Publishing：用 OIDC 换取 1 小时有效的临时 API Key
      # 需要在 nuget.org 配置 Trusted Publishing Policy
      # 需要在仓库 Secrets 中配置 NUGET_USER（你的 nuget.org Profile Name）
      # ──────────────────────────────────────────────
      - name: NuGet login (OIDC)
        id: login
        if: startsWith(github.ref, 'refs/tags/v')
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # ──────────────────────────────────────────────
      # 只有 tag push 才发布到 NuGet.org
      # 临时 API Key 由上一步 OIDC 登录生成
      # ──────────────────────────────────────────────
      - name: 发布到 NuGet.org
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet nuget push "${{ env.ARTIFACTS_DIR }}/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source "https://api.nuget.org/v3/index.json"
          --skip-duplicate