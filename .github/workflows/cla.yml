name: "CLA Assistant"
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/version1/cla.json'
          branch: 'cla-signatures'
          path-to-document: 'https://raw.githubusercontent.com/YongAnGame/YongAnGame.ModuleLib/main/CLA.md'
          allowlist: 'YongAn404,dependabot[bot],renovate[bot]'
          custom-notsigned-prcomment: '感谢你的贡献！请签署 CLA 后我们才能合并你的 PR。'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: '所有贡献者均已签署 CLA。'