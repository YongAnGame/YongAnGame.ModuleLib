name: 功能请求
description: 提出一个新功能或改进建议
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请描述使用场景和期望行为。

  - type: textarea
    id: problem
    attributes:
      label: 背景 / 问题
      description: 当前遇到什么困难？为什么需要这个功能？
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望 API 或行为是什么样的？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 你考虑过哪些替代方案？
    validations:
      required: false

  - type: dropdown
    id: impact
    attributes:
      label: 影响范围
      options:
        - 新 API
        - 现有 API 行为变更
        - 性能改进
        - 文档
        - 构建 / 工具链
        - 其他
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性
      description: 是否涉及破坏性变更？是否需要考虑多目标框架？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复
          required: true
        - label: 我愿意提交 PR 实现此功能
          required: false