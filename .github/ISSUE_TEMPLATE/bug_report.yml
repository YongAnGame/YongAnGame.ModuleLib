name: Bug 报告
description: 报告一个可复现的问题
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你报告问题。请尽量提供完整信息，以便我们快速定位。

  - type: input
    id: version
    attributes:
      label: 版本
      description: NuGet 版本号、git commit 或分支
      placeholder: "例如：1.2.3 / commit abcdefg"
    validations:
      required: true

  - type: dropdown
    id: tfm
    attributes:
      label: 目标框架
      description: 出现问题的目标框架
      options:
        - net10.0
        - net8.0
        - netstandard2.1
        - netstandard2.0
        - net47
        - 其他
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: .NET SDK 版本、操作系统、IDE
      placeholder: "例如：.NET 10.0.100, Windows 11, VS 2022 17.14"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 最小、可重复的步骤
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true

  - type: textarea
    id: stacktrace
    attributes:
      label: 异常堆栈
      description: 如果有异常，请粘贴完整堆栈
      render: text
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: 最小复现
      description: 可粘贴的代码、仓库链接或测试用例
      render: csharp
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复
          required: true
        - label: 我愿意提交 PR 修复此问题
          required: false

  - type: textarea
    id: additional
    attributes:
      label: 附加信息
      description: 截图、日志、相关链接等
    validations:
      required: false