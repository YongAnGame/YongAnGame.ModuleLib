name: RFC / 重大改动
description: 对接口、架构或行为提出重大改动
title: "[RFC]: "
labels: ["rfc", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        重大改动请先通过 RFC 讨论，避免方向不一致。

  - type: textarea
    id: summary
    attributes:
      label: 概述
      description: 一句话说明提案
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 为什么需要这个改动？解决什么问题？
    validations:
      required: true

  - type: textarea
    id: design
    attributes:
      label: 详细设计
      description: API、类型、命名空间、行为、示例代码
      render: markdown
    validations:
      required: true

  - type: textarea
    id: api
    attributes:
      label: API 变更
      description: 新增 / 修改 / 删除的公开成员
    validations:
      required: true

  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性影响
      description: 破坏性 / 非破坏性，迁移方式
    validations:
      required: true

  - type: textarea
    id: threading
    attributes:
      label: 线程安全
      description: 并发契约和实现机制
    validations:
      required: true

  - type: textarea
    id: tfm
    attributes:
      label: 多目标框架
      description: 对各 TFM 的影响，是否需要 #if 或 Polyfill
    validations:
      required: true

  - type: textarea
    id: testing
    attributes:
      label: 测试计划
      description: 如何验证，包括并发测试
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
    validations:
      required: false

  - type: textarea
    id: unresolved
    attributes:
      label: 未解决问题
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue / RFC
          required: true
        - label: 我愿意根据讨论结果提交 PR
          required: false