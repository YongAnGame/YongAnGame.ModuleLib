apiRules:
  # 排除所有 internal 成员
  - exclude:
      uidRegex: ^.*\.Internal\..*$
      type: Namespace
  # 排除 System 命名空间下的类型（避免污染文档）
  - exclude:
      uidRegex: ^System\.
      type: Namespace
  # 排除测试相关类型
  - exclude:
      uidRegex: .*Test.*
      type: Type
  # 排除 Object 与 ValueType
  - exclude:
      uidRegex: ^System\.Object$
      type: Type
  - exclude:
      uidRegex: ^System\.ValueType$
      type: Type